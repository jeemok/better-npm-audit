# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm ci
    - run: npm run lint
    - run: npm run test
    - run: npm run audit
  # Catch changes to `npm audit` output early: run against the newest npm on the newest Node
  npm-latest:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24.x
    - run: npm install -g npm@latest
    - run: npm --version
    - run: npm ci
    - run: npm run build
    - run: npm run test
    - name: Audit a project with a known vulnerability, in table and JSON form
      run: |
        mkdir /tmp/vuln && cd /tmp/vuln
        npm init -y > /dev/null
        npm install minimist@1.2.0
        if node "$GITHUB_WORKSPACE/lib" audit; then echo "expected the audit to fail"; exit 1; fi
        node "$GITHUB_WORKSPACE/lib" audit --json > out.json || true
        node -e "const r = require('./out.json'); if (r.passed !== false || r.summary.total < 1) { console.error(r); process.exit(1); }"
