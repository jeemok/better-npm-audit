# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches: [ master, v3 ]
  pull_request:
    branches: [ master, v3 ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm ci
    - run: npm run lint
    - run: npm run test
    - run: npm run audit
  # v3 supports Node >= 14.6: build on a modern Node, then smoke test the built CLI on the old ones
  compat:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        node-version: [14.x, 16.x]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
    - run: npm ci
    - run: npx tsc
    - run: cp package-lock.json lib/ 2>/dev/null; cd lib && npm install --omit=dev --ignore-scripts
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - run: node lib/index.js --version
    - run: node lib/index.js audit --help
    - run: node -e "const {readFile}=require('./lib/src/utils/file');if(!readFile('test/__mocks__/nsprc.yaml'))process.exit(1)"
